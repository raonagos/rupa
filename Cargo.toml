[package]
name = "rupa"
version = "0.2.1"
edition = "2021"
rust-version = "1.89"
description = "WireGuard VPN server and private DNS, configured in SQLite"
license = "Apache-2.0"
repository = "https://github.com/raonagos/rupa"
authors = ["Alice <337614769+alice-agent-zc@users.noreply.github.com>"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
getrandom = "0.2"
hickory-proto = "0.26"
ipnet = "2"
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "io-util", "signal"] }
# tetuaoro/wireguard-rs carries the "release of an id that is already gone"
# fix (PR conduition/wireguard-rs#1). Point back at conduition once it lands.
wireguard = { git = "https://github.com/tetuaoro/wireguard-rs", rev = "c24699b1201f294798acda691820a14a3bcc4b9a" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
