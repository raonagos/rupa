name: Release artifact

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Checksum
        run: cd target/release && sha256sum rupa > rupa.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: rupa-x86_64-linux
          path: |
            target/release/rupa
            target/release/rupa.sha256
