name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          packaging/build-deb.sh
          cp target/release/rupa dist/rupa
          (cd dist && sha256sum rupa rupa_*_*.deb > SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "rupa $GITHUB_REF_NAME" \
            --generate-notes \
            dist/rupa dist/SHA256SUMS dist/rupa_*_*.deb
